services:

  db:
    image: postgres:18
    container_name: mancore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mancore
      POSTGRES_USER: mancore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mancore_postgres_data:/var/lib/postgresql
    networks:
      - mancore-network

  api:
    build: .
    container_name: mancore-api
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 4G
          pids: 200
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - mancore_api_uploads:/app/app/static/anexos
    networks:
      - mancore-network

volumes:
  mancore_postgres_data:
  mancore_api_uploads:

networks:
  mancore-network:
    driver: bridge
